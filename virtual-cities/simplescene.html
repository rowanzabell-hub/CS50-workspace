<script>
let canvas = new SceneCanvas();
canvas.addPointLight(-100,200,0,200,200,200,1.0);
canvas.addPointLight(100,200,0,200,200,200,1.0);
canvas.addPointLight(0,0,-100,200,200,200,1.0);
canvas.addPointLight(0,0,100,200,200,200,1.0);
canvas.addCamera(0,2,0,0);
canvas.addCamera(0,2,-40,180);
canvas.addBox(0,-25,0,1000,50,1000,100,100,100,1,0,0,0,0);
canvas.addEllipsoid(-4,1,-8,1,1,1,255,255,255,1,0,0,0,0);
canvas.addEllipsoid(-4,2.5,-8,0.7,0.7,0.7,255,255,255,1,0,0,0,0);
canvas.addBox(-4,3.4,-8,0.7,0.4,0.7,0,0,0,1,0,0,0,0);
canvas.addEllipsoid(0,1,-12,1,1,1,255,255,255,1,0,0,0,0);
canvas.addEllipsoid(0,2.5,-12,0.7,0.7,0.7,255,255,255,1,0,0,0,0);
canvas.addBox(0,3.4,-12,0.7,0.4,0.7,0,0,0,1,0,0,0,0);
canvas.addEllipsoid(5,1,-6,1,1,1,255,255,255,1,0,0,0,0);
canvas.addEllipsoid(5,2.5,-6,0.7,0.7,0.7,255,255,255,1,0,0,0,0);
canvas.addBox(5,3.4,-6,0.7,0.4,0.7,0,0,0,1,0,0,0,0);
canvas.addMesh("meshes/cow.obj",1,1,-7,0,0,0,1,1,1,0,255,255,1,0);
canvas.addTexturedMesh("meshes/smokestack/medres.obj","meshes/smokestack/medres.mtl",0,18,-20,0,180,0,10,10,10,0);
canvas.name = "Simple Sample Scene";
canvas.repaint();
</script><table cellpadding>
